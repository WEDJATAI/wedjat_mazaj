<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mazaj — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #16110e;
    color: #f5ede4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 340px; }
  .flame {
    width: 88px; height: 88px;
    margin: 0 auto 20px;
    display: grid; place-items: center;
    font-size: 44px;
    border-radius: 26px;
    background: rgba(232, 177, 78, 0.14);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  p { font-size: 14px; line-height: 1.6; color: #b8a894; margin-bottom: 6px; }
  .hint { font-size: 12.5px; color: #8d7f6e; margin-top: 14px; }
  .dot { color: #f0b35c; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="flame">🔥</div>
    <h1>You're offline</h1>
    <p>Mazaj can't reach the lounge right now.</p>
    <p>Orders you place are saved on this device and will <b>sync automatically</b> the moment you're back online.</p>
    <p class="hint"><span class="dot">●</span> Reconnect and reopen the app to continue.</p>
  </div>
  <script>
    // Auto-reload once connectivity returns.
    window.addEventListener('online', () => location.replace('/'));
    setInterval(() => { if (navigator.onLine) location.replace('/'); }, 5000);
  </script>
</body>
</html>
